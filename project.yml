name: BarSpeed
options:
  bundleIdPrefix: com.barspeed
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  BarSpeed:
    type: application
    platform: iOS
    sources:
      - path: BarSpeed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.barspeed.app
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: 杠速
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_NSCameraUsageDescription: 相机用于识别杠铃运动轨迹，测算速度、功率与位移。画面仅在本机处理。
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: 从相册导入已经拍好的训练视频，用于事后逐帧分析。
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 把带轨迹叠加的训练视频保存到相册。
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # 自用包（只装自己手机、不上商店）：取消下一行注释，编译时定义 PERSONAL，
        # RootView 里会把 isPro 直接置 true，付费墙全部解锁。
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) PERSONAL

schemes:
  BarSpeed:
    build:
      targets:
        BarSpeed: all
    run:
      config: Debug
    archive:
      config: Release
